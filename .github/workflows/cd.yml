name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Публикация образов в GHCR
    if: vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Войти в реестр
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и запушить бэкенд
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/oneclickml-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/oneclickml-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Собрать и запушить фронтенд
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/oneclickml-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/oneclickml-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
